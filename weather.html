<!doctype html><html lang="ko"><meta charset="utf-8"><title>날씨 API 실습</title><style>body{font:20px/1.6 sans-serif;max-width:900px;margin:40px auto}button,select{font-size:20px;padding:10px}pre{white-space:pre-wrap;background:#eee;padding:20px}#result{font-size:28px}</style><h1>우리 지역 날씨 비교하기</h1><label>지역 <select id="city"><option value="37.57,126.98">서울</option><option value="35.18,129.08">부산</option></select></label> <button id="load">날씨 불러오기</button><p id="result">아직 요청하지 않았습니다.</p><h2>요청 주소</h2><p id="url"></p><h2>받은 JSON</h2><pre id="json"></pre><p>출처: <a href="https://open-meteo.com/">Open-Meteo</a>. 관측소 실측값과 동일하다고 단정하지 않습니다.</p><script>document.querySelector('#load').onclick=async()=>{const [latitude,longitude]=document.querySelector('#city').value.split(',');const url='https://api.open-meteo.com/v1/forecast?latitude='+latitude+'&longitude='+longitude+'&current=temperature_2m&timezone=Asia%2FSeoul';document.querySelector('#url').textContent=url;document.querySelector('#result').textContent='불러오는 중';try{const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();document.querySelector('#json').textContent=JSON.stringify(data,null,2);document.querySelector('#result').textContent=data.current.time+' 기온 '+data.current.temperature_2m+' '+data.current_units.temperature_2m;}catch(e){document.querySelector('#result').textContent='오류: '+e.message;}};</script></html>
