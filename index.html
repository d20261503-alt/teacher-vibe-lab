body{max-width:900px;margin:30px auto;padding:20px}button{padding:12px;font-size:18px}h1{font-size:28px}#preview img{max-height:300px;object-fit:contain}</style><h1>MediaPipe ImageClassifier (EfficientNet Lite0)</h1>
<p id="status">모델 로딩 중...</p>

<input type="file" id="fileInput" accept="image/*" disabled>
<div id="preview"></div>
<div id="results"></div>

<button id="sample" disabled>예제 사진으로 분류</button><p>실습 사진: Jon Sullivan, Cup of coffee (1), Public domain. 사진 분류는 브라우저에서 실행합니다.</p><p><a href="weather.html">4차시 날씨 API 실습</a></p><script type="module">
// ⚙️ JavaScript 전체 코드

const statusEl = document.getElementById("status");
const fileInput = document.getElementById("fileInput");
const previewEl = document.getElementById("preview");
const resultsEl = document.getElementById("results");

let imageClassifier;

async function init() {
  try {
    // 동적 import로 MediaPipe Tasks Vision 불러오기
    const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0");
    const { ImageClassifier, FilesetResolver } = vision;

    const filesetResolver = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
    );

    imageClassifier = await ImageClassifier.createFromOptions(
      filesetResolver,
      {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite"
        },
        runningMode: "IMAGE",
        maxResults: 3
      }
    );

    statusEl.textContent = "모델 로딩 완료! 이미지를 업로드하세요.";
    fileInput.disabled = false;
  } catch (err) {
    statusEl.textContent = "모델 로딩 실패";
    resultsEl.innerHTML = `<p style="color:red;font-weight:bold;">${err}</p>`;
  }
}

fileInput.addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file) return;

  // 미리보기
  const img = document.createElement("img");
  img.src = URL.createObjectURL(file);
  img.style.maxWidth = "300px";
  img.style.border = "1px solid #ccc";
  previewEl.innerHTML = "";
  previewEl.appendChild(img);

  resultsEl.innerHTML = "분류 중...";

  try {
    const image = await createImageBitmap(file);
    const result = imageClassifier.classify(image);

    resultsEl.innerHTML = "<h3>Top 3 결과</h3>";
    result.classifications[0].categories.forEach(cat => {
      const p = document.createElement("p");
      p.textContent = `${cat.categoryName} : 모델 점수 ${cat.score.toFixed(3)}`;
      resultsEl.appendChild(p);
    });
  } catch (err) {
    resultsEl.innerHTML = `<p style="color:red;font-weight:bold;">오류: ${err}</p>`;
  }
});

init();

const ready=setInterval(()=>{if(imageClassifier){sampleButton.disabled=false;clearInterval(ready);}},200);
